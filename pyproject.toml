[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pytest-opentelemetry"
dynamic = ["version"]
description = "A pytest plugin for instrumenting test runs via OpenTelemetry"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Guidry", email = "chris@theguidrys.us" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Framework :: Pytest",
]
dependencies = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-semantic-conventions>=0.49b0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
container = ["opentelemetry-container-distro>=0.1.0"]

[dependency-groups]
dev = [
    "pytest-opentelemetry[container]",
    "codespell>=2.4.1",
    "freezegun>=1.5.0",
    "loq>=0.1.0a3",
    "prek>=0.3.1",
    "pyright>=1.1.408",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
]

[project.urls]
"Repository" = "https://github.com/chrisguidry/pytest-opentelemetry"
"Bug Tracker" = "https://github.com/chrisguidry/pytest-opentelemetry/issues"

[project.entry-points.pytest11]
pytest_opentelemetry = "pytest_opentelemetry.plugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_opentelemetry"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
addopts = [
    "--cov=src/pytest_opentelemetry",
    "--cov=tests",
    "--cov-report=term-missing:skip-covered",
    "--cov-branch",
    "--cov-fail-under=100",
]
filterwarnings = ["error"]

[tool.coverage.report]
# pytest imports these two modules to load the plugin, before pytest-cov
# starts measuring, so their module-level lines never count as covered.
omit = [
    "src/pytest_opentelemetry/__init__.py",
    "src/pytest_opentelemetry/plugin.py",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
