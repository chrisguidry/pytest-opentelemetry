name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install --upgrade pip build
    - run: python -m build
    - run: pip install -e '.[dev]'
    - run: pytest
    - if: matrix.python-version == '3.14'
      run: pre-commit run --all-files

  # The one check main's ruleset requires. It succeeds only when every job
  # it needs succeeded, so a job added to or renamed in this workflow counts
  # without a change to the ruleset.
  all-checks-passed:
    name: All checks passed
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Fail unless every needed job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
